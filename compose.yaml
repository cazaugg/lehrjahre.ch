services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=lehrjahre
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      # Traefik is the edge proxy: never trust client-supplied X-Forwarded-*
      # headers, they are stripped/overwritten (ProxyFix trusts one hop).
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/lehrjahre.ch/traefik:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: lehrjahre:latest
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LEHRJAHRE_ENV: production
      LEHRJAHRE_DEBUG: "0"
      COOKIE_SECURE: "true"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (min. 32 chars) in .env}
      DATABASE_URL: sqlite:////data/lehrjahre.ch/app/control.db
      LEHRJAHRE_COMPANY_ROOT: /data/lehrjahre.ch/app
    volumes:
      - /data/lehrjahre.ch/app:/data/lehrjahre.ch/app
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.lehrjahre.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.lehrjahre.entrypoints=websecure
      - traefik.http.routers.lehrjahre.tls.certresolver=le
      - traefik.http.routers.lehrjahre.middlewares=security-headers@docker,compress@docker
      - traefik.http.services.lehrjahre.loadbalancer.server.port=5000
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.compress.compress=true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/api/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: lehrjahre
