services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=lehrjahre
      # File provider: loads the Cloudflare Origin Certificate (traefik/dynamic.yml).
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      # Traefik sits behind Cloudflare: trust X-Forwarded-* only from its edge
      # (refresh the ranges via https://www.cloudflare.com/ips-v4 / ips-v6).
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      # Cloudflare already ends X-Forwarded-For with the visitor IP. Do not
      # append the Cloudflare edge address: ProxyFix trusts exactly one hop.
      - --entrypoints.websecure.forwardedHeaders.notAppendXForwardedFor=true
      - --ping=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
      # Cloudflare Origin Certificate: host system config, never app data
      # (kept out of the /data backup tree). Rotation: replace + restart.
      - /etc/ssl/lehrjahre.pem:/etc/traefik/certs/lehrjahre.pem:ro
      - /etc/ssl/lehrjahre.key:/etc/traefik/certs/lehrjahre.key:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        # Stamp the image with its git commit; deploy with e.g.
        # GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_SHA: ${GIT_SHA:-}
    image: lehrjahre:latest
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LEHRJAHRE_ENV: production
      LEHRJAHRE_DEBUG: "0"
      COOKIE_SECURE: "true"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (min. 32 chars) in .env}
      DATABASE_URL: sqlite:////data/lehrjahre.ch/app/control.db
      LEHRJAHRE_COMPANY_ROOT: /data/lehrjahre.ch/app
      LEHRJAHRE_PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      # Outgoing mail (signup verification) from MAIL_FROM; requires an
      # SMTP account, e.g. kontakt@lehrjahre.ch.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-kontakt@lehrjahre.ch}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-1}
      USER_INVITE_TTL_HOURS: ${USER_INVITE_TTL_HOURS:-168}
    volumes:
      - /data/lehrjahre.ch/app:/data/lehrjahre.ch/app
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.lehrjahre.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.lehrjahre.entrypoints=websecure
      - traefik.http.routers.lehrjahre.tls=true
      - traefik.http.routers.lehrjahre.middlewares=security-headers@docker,compress@docker
      - traefik.http.services.lehrjahre.loadbalancer.server.port=5000
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.compress.compress=true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/api/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: lehrjahre
